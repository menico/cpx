[workspace]
members = ["crates/cpx-core", "crates/cpx-cli", "crates/cpx-app"]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
thiserror = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
